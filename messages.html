{% load static %}
{% if messages %}
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .swal2-centered-popup { text-align: center; border-radius: 12px; }
    .swal2-popup .swal2-title { font-family: 'Poppins', sans-serif; color: #1f2937; font-weight:700; }
    .swal2-popup .swal2-html-container { font-family: 'Poppins', sans-serif; color:#374151; font-size:14px; white-space:pre-line; }
    .swal2-confirm { background: linear-gradient(90deg,#2a6ee1,#00c9b7); color: #fff; border: none; }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      {% for message in messages %}
        Swal.fire({
          icon: "{{ message.tags|default:'info' }}",
          html: "<div style=\"padding:6px 4px\">{{ message|escapejs }}</div>",
          position: 'center',
          showConfirmButton: true,
          confirmButtonText: 'OK',
          customClass: { popup: 'swal2-centered-popup' },
          backdrop: true,
          didOpen: () => {
            // subtle grow animation
          }
        });
      {% endfor %}
    });
  </script>
{% endif %}
