<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Login</title>
</head>

<body>
<form action="/login_post" method="post">
    {% csrf_token %}
    <table width="200" border="1">
  <tr>
    <th scope="row">username</th>
    <td><label for="textfield"></label>
      <input type="text" name="textfield" id="textfield" /></td>
  </tr>
  <tr>
    <th scope="row">password</th>
    <td><label for="textfield2"></label>
      <input type="password" name="textfield2" id="textfield2" /></td>
  </tr>
  <tr>
    <th colspan="2" scope="row"><input type="submit" name="button" id="button" value="login" /></th>
    </tr>
</table>
</form>
<a href="#">User Registration</a><br /><br />
<a href="/register_company_get">Company Registration</a>
</body>
</html>
